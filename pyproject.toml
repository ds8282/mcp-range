[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-range"
version = "0.1.0"
description = "A deliberately vulnerable MCP server (dvmcp) and a static+live MCP vulnerability scanner (mcpscan), for security training."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Dev Sheth" }]
keywords = ["mcp", "security", "owasp", "training", "scanner", "sast"]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
dvmcp = "dvmcp.__main__:main"
mcpscan = "mcpscan.__main__:main"

[tool.setuptools]
packages = ["dvmcp", "dvmcp.challenges", "mcpscan", "mcpscan.static", "mcpscan.live"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
